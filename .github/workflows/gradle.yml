name: Java CI with Gradle (Backend API)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: database
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Oracle OpenJDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'oracle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradle wrapper
      run: chmod +x backend/gradlew

    - name: Run Linter (Checkstyle plugin)
      working-directory: backend
      run: ./gradlew checkstyleMain
      continue-on-error: true
      id: lint-check

    - name: Run SpotBugs (Check for Unused Variable)
      working-directory: backend
      run: ./gradlew spotbugsMain
      continue-on-error: true
      id: var-check

    - name: Build with Gradle Wrapper
      working-directory: backend
      run: ./gradlew build
      env:
        # Map Spring Boot properties to the service container
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/database
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: password

    - name: Comment on PR if formatting fails
      if: (steps.lint-check.outcome == 'failure' || steps.var-check.outcome == 'failure') && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          let message = '## ❌ Checks Failed\n\n';
          if ('${{ steps.lint-check.outcome }}' === 'failure') {
            message += '❌ Checkstyle failed - Run `./gradlew spotlessApply`\n';
          }
          if ('${{ steps.var-check.outcome }}' === 'failure') {
            message += '❌ SpotBugs failed - Remove unused variables\n';
          }
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: message
          });

    - name: Fail if checks failed
      if: steps.lint-check.outcome == 'failure' || steps.var-check.outcome == 'failure'
      run: exit 1