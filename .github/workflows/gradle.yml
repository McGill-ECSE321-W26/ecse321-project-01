name: Java CI with Gradle (Backend API)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Oracle OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'
      
      - name: Run Google Java Format
        uses: axel-op/googlejavaformat-action@v4
        with:
          # Pointing to the specific directory for your backend
          files: "backend/**/*.java"
          args: "--skip-sorting-imports --replace"
          commit-message: "Refactor: apply Google Java Format"

  # Job 2
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: database
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Oracle OpenJDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'oracle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradle wrapper
      run: chmod +x backend/gradlew

    - name: Build with Gradle Wrapper
      working-directory: backend
      run: ./gradlew build
      env:
        # Map Spring Boot properties to the service container
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/database
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: password
