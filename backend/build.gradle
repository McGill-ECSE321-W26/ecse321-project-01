import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.Confidence

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id("com.diffplug.spotless") version "8.2.1"
    id 'com.github.spotbugs' version "6.4.8"
    id 'jacoco'
}

group = 'ca.mcgill.ecse321'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.security:spring-security-crypto'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

checkstyle {
    toolVersion = "13.1.0"
}

tasks.withType(Checkstyle) {
    exclude '**/model/**'
    ignoreFailures = false
}

spotless {
    java {
        target 'src/**/*.java'
        targetExclude '**/model/**'
        removeUnusedImports()
        googleJavaFormat()
    }
}

spotbugs {
    toolVersion = '4.9.8'
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('LOW')
    excludeFilter = file('config/spotbugs/spotbugs-exclude.xml')
    includeFilter = file('config/spotbugs/spotbugs-include.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        exceptionFormat "full"
        events "passed", "failed"
    }
    finalizedBy jacocoTestReport
}

tasks.register('integrationTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'ca.mcgill.ecse321.group1.integration.*'
    }
    testLogging {
        exceptionFormat "full"
        events "passed", "failed"
    }
}

tasks.named('jacocoTestReport') {
    dependsOn test // tests are required to run before generating the report
}

tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            limit {
                minimum = 0.6
            }
        }
    }
    dependsOn test // tests are required to run before checking code coverage.
}